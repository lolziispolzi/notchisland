name: CI
run-name: NotchIsland - LPL Inc.

on:
  push:
    branches: [main, 'macos-*']
  workflow_dispatch:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Save build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Test
        run: swift test

      - name: Package app (ad-hoc signed)
        run: ./scripts/build-app.sh

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: NotchIsland
          path: build/*.zip
