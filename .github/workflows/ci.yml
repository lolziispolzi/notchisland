name: CI
run-name: NotchIsland - LPL Inc.

on:
  push:
    branches: [main, 'macos-*']
  workflow_dispatch:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Save build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Test
        run: swift test

      - name: Package app (ad-hoc signed)
        run: ./scripts/build-app.sh

      - name: Inspect app linking
        run: |
          BIN=build/NotchIsland.app/Contents/MacOS/NotchIsland
          vtool -show-build "$BIN" | grep -E "minos|platform" || true
          otool -L "$BIN"
          otool -l "$BIN" | grep -B1 -A2 -E "LC_LOAD_WEAK_DYLIB|LC_RPATH" || true
          ls build/NotchIsland.app/Contents/Frameworks 2>/dev/null || true
          find "$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib" -maxdepth 2 -name "swift-5*" -o -maxdepth 3 -name "libswift_Concurrency.dylib" | head

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: NotchIsland
          path: build/*.zip
